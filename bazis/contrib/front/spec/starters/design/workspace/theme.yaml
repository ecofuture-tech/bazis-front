# yaml-language-server: $schema=../schema/design.schema.json
# The design of the frontend: the preset, the layers of its tokens and its options (an option
# left out is that of the preset), compiled with tokens.json by `manage.py bazis_front design`.
spec: bazis-design/1
preset: workspace          # a working application: sidebar, tables, forms in dialogs
palette: frost             # indigo | forest | ember | slate | ocean | plum | pine | frost
fonts: golos               # system | inter | manrope | ibm-plex | geist | source-serif-display | literata-golos | golos
shape: soft                # sharp | soft | round
surface: lifted            # flat | bordered | elevated | lifted
mode: both                 # both (switched by the user) | light | dark
navigation: sidebar        # sidebar | topbar
# shell: {sidebar: rail}   # the sidebar a rail of icons until the user expands it (expanded from lg by default)
density: comfortable       # comfortable | compact
composition:
  list: table              # table | cards
  list_phone: cards        # cards | table (scrolled sideways)
  list_card: split         # split (the list and the card side by side) | pages
  forms: dialog            # dialog | page
  filters: plate           # plate (on a surface) | row (on the page)
  list_tools: header       # list (the search, the view, the actions over the list) | header (beside the title)
# the icon of each entity with a screen (a lucide icon, lucide.dev), by the id of the entity:
# icons: {book: book-open, reader: users, loan: clipboard-list}
# the tone of the badge of each status of bazis-statusy (neutral, primary, info, success,
# warning, danger), by the id of the status:
# statuses: {draft: neutral, in_progress: info, done: success, rejected: danger}
