# yaml-language-server: $schema=./schema/product.schema.json
# The product spec: the roles, the entities (the resources of the backend, with their
# fields, workflow and access) and the scenarios. Check it against the contract with
# `python manage.py bazis_front check`; the format and the codes of its issues are in
# AGENTS.md of the installed package bazis-front (bazis/contrib/front/AGENTS.md).
spec: bazis-product/1
product:
  id: product
  name: Product
# The languages of the interface, as the backend has them (LANGUAGES and the base code of
# LANGUAGE_CODE; `check` compares them with the contract):
# languages: [en, ru]
# language: en
roles: []
entities: []
scenarios: []
