# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-front"
summary = "the frontend layer of a Bazis product (pre-release): a React + TypeScript + Vite frontend made from a template, with the contract and its TypeScript generated from the backend, the protocol client copied into it, and the specs of the product validated against the contract"
solves = [
    "a typed frontend of a Bazis backend whose contract is generated from its OpenAPI",
    "the resources, roles and transits of the backend as one generated contract.json for the frontend and AI agents",
    "the JSON:API protocol of Bazis in TypeScript: filters, errors, pagination, login, permission meta, transits, uploads",
    "a new frontend next to the backend: React 19, TypeScript, Vite 7, TanStack Query, Tailwind 4 with shadcn/ui",
    "the product described as specs (roles, entities, access, scenarios, screens, design) and checked against the backend: missing resources, fields, transits and permissions of the roles",
]
requires = ["bazis"]
pairs_well = [
    "bazis-users", "bazis-authing", "bazis-permit", "bazis-statusy", "bazis-uploadable", "bazis-ws",
    "bazis-bg", "bazis-async-background", "bazis-async-request",
]

[[extension_points]]
name = "manage.py bazis_front"
import = "bazis.contrib.front.management.commands.bazis_front.Command"
use_when = "create the frontend of the product with `bazis_front init` (frontend/ with the copied client and its lock, and the starters of spec/); export the contract with `bazis_front contract` (contract/openapi.json, contract/contract.json and frontend/src/bazis/generated/), `--check` only compares; validate spec/ against the contract with `bazis_front check` (`--json`, exit 1 on errors); copy the components with `bazis_front add`; generate the end-to-end tests of the scenarios with `bazis_front e2e` (`--check` only compares); compile spec/design/ into the theme of the frontend with `bazis_front design` (`--check` only compares); after `pip install -U bazis-front`, bring the copies to the new version with `bazis_front update` (a three-way merge with the changes of the product, `--check` only lists them); see the copies, the generated files and every stale or changed one with `bazis_front status` (`--json`, writes nothing)"

[[pitfalls]]
text = "the contract (contract/openapi.json, contract/contract.json) is generated: export it again after every change of the backend, never edit it"
check = "front.W001"

[[pitfalls]]
text = "the permit roles and the statusy transits of the contract are read from the database: export from a migrated database (`migrate` applies the roles, statuses and transits declared in roles.py and workflow.py)"
check = "front.E002"

[[pitfalls]]
text = "frontend/src/bazis/generated/ (contract.ts, schema.d.ts) is written by `bazis_front contract`, never by hand; schema.d.ts needs Node and the `npm install` of the frontend, otherwise it is `missing` in the lock and `contract --check` fails"
check = "front.W001"

[[pitfalls]]
text = "the specs (spec/) are checked against contract/contract.json: export the contract before `bazis_front check`; `access` must be covered by the permissions of the permit roles (P019), and the issues have stable codes (the section \"The issues of check\" of AGENTS.md)"
check = "front.W002"

[[pitfalls]]
text = "the theme of the frontend (frontend/src/bazis/generated/theme.css and theme.ts) is compiled from spec/design/ by `bazis_front design` (and `init`): generate it again after every change of the design and after `bazis_front update`, never edit it; colors, radii and fonts of the screens come from its tokens (Tailwind classes such as `bg-primary`, `bg-success-soft`), never literal colors"
check = "front.W005"

[[pitfalls]]
text = "the screens in frontend/src/screens/generated/ (their routes, the navigation, the texts of the specs) are written by `bazis_front screens` (and `init`) from spec/, never by hand: generate them again after every change of the specs (and after the `bazis_front update` of a frontend made before them, which has none); what a spec cannot say goes to an extension (`extend`, src/screens/<id>/extend.tsx) or a custom screen (`custom`, src/screens/<id>/index.tsx); a generated file edited since is not overwritten without `--force`"
check = "front.W010"

[[pitfalls]]
text = "the assets follow the protocol of recent Bazis packages: bazis-ws>=2.5.0 (the socket is open at `subscribed`), bazis-authing>=2.6.0 (the logout), bazis-permit>=2.7.0 (the selectors, the filters restricted to the fields the user sees), bazis-statusy>=2.12.0 (the translated payload schemas, the initial status of each model), bazis-uploadable>=2.7.0 (the files of their author, their download route), bazis-bg>=2.6.0 (the download of the file of a task); an older installed package is the warning front.W006 (the error C004 of `bazis_front check`): upgrade it"
check = "front.W006"

[[pitfalls]]
text = "the client in frontend/src/bazis/client/ is a copy kept pristine for the updates of bazis-front: wrap it in src/app/, do not edit it"

[[pitfalls]]
text = "after `pip install -U bazis-front` the copies in frontend/ are of the old version until `bazis_front update` merges the new one with the changes of the product; it fails with conflict markers in the files that both changed (resolve them, then tsc and npm test: tsc finds the markers left in .ts/.tsx only, `update --check` and front.W004 in every file of the conflicts until they are gone), and `add` refuses until then; commit frontend/.bazis/ (the pristine copies the merge needs) and the lock"
check = "front.W004"

[[pitfalls]]
text = "a copy of bazis-front changed in frontend/ (a file of src/bazis/ or e2e/bazis/ whose hash differs from bazis-front.lock.json) is merged by `bazis_front update` with every new version, a change of the same lines by both is a conflict: never edit the client, the hooks, the i18n or the helpers; change a component through its props or a component of the product that composes it"
check = "front.W007"

[[pitfalls]]
text = "frontend/e2e/generated/shots.ts is written by `bazis_front shots` from the specs, never by hand: take the screenshots again after a change of the screens, the scenarios or the design"
check = "front.W008"

[[pitfalls]]
text = "the screens are done when `bazis_front shots` (the backend and the frontend running, E2E_PASSWORD set) reports no error in frontend/.scratch/shots/report.json (a page that scrolls sideways on a phone, a raw name or a UUID shown, a text without contrast, a screen not reached) and the screenshots pass the checklist of the guide: fix the specs, the screens or the backend and take them again, at most three rounds; the errors left after them, or screenshots never taken (no report), are the warning front.W009, not a stale part of the frontend; .scratch/ is never committed"
check = "front.W009"

[[pitfalls]]
text = "bazis-ws keeps nothing: a message published before the page subscribed is lost; publish after the commit, and the hooks refetch every query after a reconnect; the notifications of bazis-ws alone are those of the session, the stored ones are bazis-notify (notify of bazis.contrib.notify.service, which delivers them live itself: never publish them a second time with bazis-ws; the bell lists them with useInbox)"

[[pitfalls]]
text = "the file URL of an uploaded file (bazis-uploadable) or of a task (bazis-bg) is served by the media host to anyone who has it: never link it; the frontend reads the content with the token from <path><id>/download/ (useDownload, FileValue, TaskProgress)"

[[pitfalls]]
text = "the common channel of bazis-ws reaches every user session (anonymous ones with BAZIS_WS_ANONYMOUS_COMMON_CHANNEL): it is not for data, publish only the invalidation hint {\"resource\": \"<type>\"} there, the ids and the notifications only to the users who may see the item (notify of bazis.contrib.ws.messages in bazis-ws 2.6.0, user.ws_publish before)"

[[pitfalls]]
text = "bazis-uploadable gives a user only his own files, and the core (2.7) links and includes only the objects the user may see: a relationship to the file of another user is 403 ERR_RELATION_ACCESS (no check of its own in the route set, which must know the user: UserRouteBase or a route set of bazis-permit), and include leaves the file out; FileValue shows it as not available"

[[pitfalls]]
text = "the frontend is in the languages of the backend (LANGUAGES, LANGUAGE_CODE): every text of a screen goes through t() of @/bazis/i18n with a key of the dictionaries of the product (src/i18n/<language>.ts, merged over those of the components), dates and numbers through its Intl formatters; the backend translates with gettext (its catalogs made, filled and compiled by manage.py bazis_messages: make, the translations in a JSON file kept in the project, apply; .po and .mo committed) and the translated fields of its data (the names of roles, statuses and transits in every language: English gettext_lazy names in roles.py and workflow.py translated by the catalogs, with bazis-permit and bazis-statusy 2.9; the roles of bazis-permit before 2.9 set in the data migrations)"

[[pitfalls]]
text = "the contract knows the socket of bazis-ws only when it is routed in the router module (router.register('bazis.contrib.ws.router') with bazis-ws 2.6.0, under the prefix of the router; router.routes.append(ws_route) before, /ws) or on the application of BAZIS_APP_MODULE; registered only in the main module, CAPABILITIES.ws.path is null and the frontend opens no socket"

[[pitfalls]]
text = "without Kafka bazis-async-request runs a request with X-Async-Background at once and answers as usual: the frontend takes both the 202 with a task and the response"

[[pitfalls]]
text = "a choice is shown, offered and filtered by its label: the runtime schemas give the labels of the choices of a model field (enumDict, translated with gettext_lazy) and the components use them; never make a model of the choices for their labels, nor map the values to texts in the frontend; the scenarios fill and expect the label"

[[pitfalls]]
text = "an item added from the card of its parent fixes the relationship: RelatedList of resource-card (card.related of the spec) or ResourceForm fixed={{<relation>: id}} (useResourceForm(path, {fixed})), never a form of the product that sets the value in an effect"

[[pitfalls]]
text = "`manage.py e2e_data` runs before every run of the end-to-end tests and only adds: it never deletes a user or a record (of the previous runs, of the scenarios, its own), finds its records by a key of their own, creates those that are missing and sets their dates and the password again; the scenarios count only the records of `e2e_data` and change only the items they create (P033), find them by their ids (`created` of the helpers) and the notifications since their start, since the items of the runs pile up"

[[pitfalls]]
text = "the frontend is not a security boundary: permissions are checked by the backend, the frontend only reads the permission meta and the runtime schemas"

[[pitfalls]]
text = "a point of a model is a PointField (GeoJSON [lon, lat] in the API, `format: point` in the contract, `type: point` in the specs), never two float fields: the components show and edit it, `bazis_front add map` gives the maps (Leaflet, set in package.json: run npm install); declare it geography=True; the default tiles of MapProvider are OpenStreetMap for development: set the tiles of the product and its CSP in production; a list of what is near filters with nearFilter and sorts with nearSort, the nearest first"

[[pitfalls]]
text = "a custom action of a route set (`@http_post('/export/')`, kind `other` in the contract) is called with useAction of @/bazis/react (client.action), never with fetch: the client sends the token and the language, its errors are ApiError (the errors of its body by field: bodyErrors()), and the id of a task of bazis-bg that it answers with is shown by TaskProgress; an action declared with GET that a screen shows is read with useActionQuery or useItemActionQuery (a query refetched with its resource), never a react-query wrapper of your own"
