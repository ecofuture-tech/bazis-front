# yaml-language-server: $schema=../../../bazis/contrib/front/spec/schemas/screen.schema.json
# The tasks on the days they were created.
spec: bazis-screen/1
id: task-calendar
title: {en: Calendar, ru: Календарь}
description: {en: The tasks on the days they were created., ru: Задачи в дни их создания.}
route: /calendar
entity: task
roles: [manager, viewer]
primitive: calendar
custom: true  # written by hand: `bazis_front screens` does not generate a calendar yet
calendar:
  field: dt_created
  label: [title]
  views: [month, week]
  open: task-card
states: [loading, empty, error, forbidden]
