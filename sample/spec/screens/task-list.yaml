# yaml-language-server: $schema=../../../bazis/contrib/front/spec/schemas/screen.schema.json
spec: bazis-screen/1
id: task-list
title: Tasks
route: /tasks
entity: task
roles: [manager, viewer]
primitive: list
list:
  columns: [title, status, priority, assignee, dt_created]
  filters: [status, assignee, priority, dt_created]
  sort: [-dt_created]
  search: true
  open: task-card
  map: {field: location}          # the tasks with a location on a map beside the list
actions:
  - {id: create, primitive: form, mode: create, fields: [title, assignee, priority], then: task-card}
states: [loading, empty, error, forbidden]
