# yaml-language-server: $schema=../../../bazis/contrib/front/spec/schemas/screen.schema.json
# A report: the drafts, the filter of the screen combined with that of the user.
spec: bazis-screen/1
id: draft-tasks
title: {en: Drafts, ru: Черновики}
description: {en: The tasks that are not started yet., ru: 'Задачи, которые ещё не начаты.'}
route: /drafts
entity: task
roles: [manager, viewer]
primitive: list
list:
  columns: [title, assignee, dt_created]
  filters: [assignee]
  filter: {status: draft}
  sort: [-dt_created]
  open: task-card
  empty: {en: No drafts., ru: Черновиков нет.}
  row_actions: [escalate]   # a button in each row
actions:
  # the custom action of a task, with its default priority (high), confirmed
  - id: escalate
    primitive: custom
    action: escalate
    confirm: true
    label: {en: Escalate, ru: Повысить приоритет}
    title: {en: 'Escalate the task?', ru: 'Повысить приоритет задачи?'}
    description: {en: Its priority becomes high., ru: Её приоритет станет высоким.}
states: [loading, empty, error, forbidden]
