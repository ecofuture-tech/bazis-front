# yaml-language-server: $schema=../../../bazis/contrib/front/spec/schemas/screen.schema.json
spec: bazis-screen/1
id: task-card
route: /tasks/:id
entity: task
roles: [manager, viewer]
primitive: card
card:
  sections:
    - {id: main, fields: [title, status, assignee, watchers, attachment, priority, location, hours]}
    # the report is written by the transit `finish`: its section is shown once the task is done
    - {id: report, title: {en: Report, ru: Отчёт}, fields: [report], when: {status: [done]}}
  edit: true
  transitions: true
  history: true
  # the steps of the task, added here with the task fixed
  related:
    - id: steps
      title: {en: Steps, ru: Шаги}
      entity: step
      relation: task
      columns: [title, dt_created]
      add: {id: add-step, fields: [title], label: {en: Add a step, ru: Добавить шаг}}
  tabs:
    - {id: details, title: {en: Details, ru: Подробности}, sections: [main, report]}
    - {id: steps, title: {en: Steps, ru: Шаги}, related: [steps]}
    - {id: history, title: {en: History, ru: История}, history: true}
actions:
  - {id: delete, primitive: destroy, then: task-list, label: {en: Delete, ru: Удалить}, title: {en: 'Delete the task?', ru: 'Удалить задачу?'}}
  # the custom action of the task (`TaskRouteSet.action_escalate`), its priority asked for
  - id: escalate
    primitive: custom
    action: escalate
    fields: [priority]
    label: {en: Escalate, ru: Повысить приоритет}
    description: {en: The priority that the task takes., ru: 'Приоритет, который получит задача.'}
    message: {en: The priority of the task is changed., ru: Приоритет задачи изменён.}
states: [loading, error, forbidden, not_found]
