# yaml-language-server: $schema=../../../bazis/contrib/front/spec/schemas/screen.schema.json
spec: bazis-screen/1
id: task-card
title: Task
route: /tasks/:id
entity: task
roles: [manager, viewer]
primitive: card
card:
  sections:
    - {id: main, fields: [title, status, assignee, watchers, attachment, priority, location]}
    - {id: report, title: Report, fields: [report]}
  edit: true
  transitions: true
  history: true
  # the steps of the task, added here with the task fixed
  related:
    - id: steps
      title: Steps
      entity: step
      relation: task
      columns: [title, dt_created]
      add: {id: add-step, fields: [title]}
actions:
  - {id: delete, primitive: destroy, then: task-list}
states: [loading, error, forbidden, not_found]
