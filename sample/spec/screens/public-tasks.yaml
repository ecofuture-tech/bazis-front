# yaml-language-server: $schema=../../../bazis/contrib/front/spec/schemas/screen.schema.json
# A public screen: its role `visitor` is anonymous (spec/product.yaml), so the frontend shows it
# without a login. A guest reads the tasks (the permit role `viewer` is for anonymous users) and
# suggests one with the custom action `suggest`, declared `public=True`: a guest creates
# nothing through the create route.
spec: bazis-screen/1
id: public-tasks
title: {en: Team tasks, ru: Задачи команды}
description: {en: 'What the team works on; suggest a task of your own.', ru: 'Над чем работает команда; предложите свою задачу.'}
route: /public
entity: task
roles: [visitor]
primitive: list
list:
  columns: [title, status, priority, dt_created]
  sort: [-dt_created]
  empty: {en: No tasks yet., ru: Задач пока нет.}
actions:
  - id: suggest
    primitive: custom
    action: suggest
    fields: [title, photos]           # the photos uploaded in the dialog, before its submit
    labels:
      photos: {en: Photos of the place, ru: Фотографии места}
    label: {en: Suggest a task, ru: Предложить задачу}
    description: {en: The team sees it among its drafts., ru: Команда увидит её среди черновиков.}
    message: {en: The task is suggested., ru: Задача предложена.}
states: [loading, empty, error, forbidden]
