# yaml-language-server: $schema=../../bazis/contrib/front/spec/schemas/product.schema.json
# The product spec of the sample: the tasks of a team with a workflow. The roles,
# statuses and transits that it references are declared in tasks/roles.py and
# tasks/workflow.py (their Russian names in tasks/locale/ru), which `migrate` applies.
spec: bazis-product/1
product:
  id: tasks
  name: {en: Tasks, ru: Задачи}
  summary: The tasks of a team, started and finished with a report
packages: [users, authing, permit, statusy, uploadable, ws, bg, async_background, async_request, notify]
languages: [en, ru]            # LANGUAGES of the backend: the interface is in English and Russian
language: en                   # the code of LANGUAGES of LANGUAGE_CODE
# the links of the navigation in their order, each labelled by the title of its screen, and
# their groups under a heading; the icons of the board, the calendar and the home are those
# by default
navigation:
  - {screen: home}
  - group: tasks
    title: {en: Tasks, ru: Задачи}
    items:
      - {screen: task-list, icon: list-checks}
      - {screen: draft-tasks, icon: file-pen}
      - {screen: export-tasks, icon: download}   # the form of the custom action `export`, which answers a file
  - group: planning
    title: {en: Planning, ru: Планирование}
    items:
      - {screen: task-board}
      - {screen: task-calendar}
  - {screen: suggest-task, icon: send}   # public: the form of the custom action `suggest`
  - {screen: public-tasks, icon: globe}   # public: shown also to the guests, who do not log in
roles:
  - {id: manager, permit: manager, title: Manager, test_user: {username: manager}}
  - {id: viewer, permit: viewer, title: Viewer, test_user: {username: viewer}}
  # the guests, who do not log in: the permit role `viewer` is also that of the anonymous
  # users (tasks/roles.py); their screens are public (`public-tasks`)
  - {id: visitor, permit: viewer, title: Visitor, anonymous: true}
entities:
  - id: task
    resource: tasks.task
    title: {en: Task, ru: Задача}
    fields:
      - {id: title, type: string}
      - {id: report, type: text}
      - {id: dt_created, type: datetime}
      - {id: assignee, relation: user}
      - {id: attachment, type: file}     # bazis-uploadable: a file uploaded with the task
      - {id: priority, type: string}     # choices: shown, filled and filtered by their labels
      - {id: location, type: point}      # a PointField: on the map of the list, its coordinates on the card
      - {id: watchers, relation: user, many: true}   # a to-many relationship: chosen in the forms
      - {id: due, type: datetime}        # the calendar of the tasks, whose add takes its time
      - {id: hours, type: string, display: {unit: h}}   # a decimal: summed by the tile and the chart of the home
    workflow:
      initial: draft
      statuses: [draft, in_progress, done]
      transitions:
        - {id: start, from: draft, to: in_progress}
        - {id: finish, from: in_progress, to: done, payload: {fields: [{id: report, type: text}]}}
        # the payload is the id of a user: its picker, as the relationship `assignee` of the task
        - {id: reopen, from: done, to: in_progress, payload: {fields: [{id: assignee, relation: user}]}}
    access:
      manager:
        view: all
        add: all
        change: {selector: all, statuses: [draft]}
        transit: [start, finish, reopen]
      viewer: {view: all}
      visitor: {view: all}
  - id: user
    resource: users.user
    title: {en: User, ru: Пользователь}
    fields:
      - {id: username, type: string}
      - {id: dt_first_login, type: datetime}   # taken by the create of a user: the add of a calendar (the kitchen sink)
  # the steps of a task: a related section of its card, added there with the task fixed
  - id: step
    resource: tasks.step
    title: {en: Step, ru: Шаг}
    fields:
      - {id: title, type: string}
      - {id: task, relation: task}
      - {id: dt_created, type: datetime}
    access:
      manager: {view: all, add: all}
      viewer: {view: all}
scenarios:
  - id: manager-finishes-a-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Write the report}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - transit: start
      - transit: {id: finish, payload: {report: Done}}
      - expect: {status: done, field_readonly: title}
  - id: viewer-only-reads
    role: viewer
    steps:
      - open: task-list
      - expect: {action_absent: create}
      - open_item: {where: {title: Review the plan}}   # created by `manage.py e2e_data`
      # a field permission of the viewer (tasks/roles.py): the report is hidden; he adds no step
      - expect: {screen: task-card, action_absent: delete, field_absent: report}
      # nor does he escalate it: bazis-permit leaves the custom action out of his meta
      - expect: {action_absent: add-step}
      - expect: {action_absent: escalate}
  # the picker of the assignee searches the user by the label (his first and last name,
  # given by `manage.py e2e_data`); the list shows the label
  - id: manager-assigns-a-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Assign the review, assignee: Mary Manager}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - open: task-list
      - open_item: {where: {title: Assign the review, assignee: Mary Manager}}
      - expect: {screen: task-card}
  # a field permission of the manager: the report is written by the transit `finish`, never
  # in the edit of the task
  - id: manager-cannot-change-the-report
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Draft the report}
      - submit: {}
      - expect: {screen: task-card, status: draft, field_readonly: report}
  # a submit followed by the `error` of a field fails: its form stays open
  - id: manager-cannot-save-an-empty-title
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: ''}
      - submit: {}
      - expect: {error: title}
      - fill: {title: Plan the week}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - fill: {title: ''}
      - submit: {}
      - expect: {error: title}
      - fill: {title: Plan the next week}
      - submit: {}
      - transit: start
      - expect: {status: in_progress, field_readonly: title}
  # the file is uploaded in the edit of the card (e2e/fixtures/ of the frontend), then shown
  # on the card
  - id: manager-attaches-a-brief
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Attach the brief}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - upload: {field: attachment, file: brief.txt}
      - submit: {}
      - expect: {values: {title: Attach the brief, attachment: brief.txt}}
  # bazis-notify: the assignee of a finished task is notified (sample/tasks/models.py), a
  # stored notification delivered live over the socket of bazis-ws
  - id: manager-is-notified-of-a-finished-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Notify the assignee, assignee: Mary Manager}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - transit: start
      - transit: {id: finish, payload: {report: Done}}
      - expect: {status: done, notification: Notify the assignee}
  - id: viewer-reads-the-drafts
    role: viewer
    steps:
      - open: draft-tasks                                # a report: the tasks in `draft`
      - open_item: {where: {title: Review the plan}}     # created by `manage.py e2e_data`
      - expect: {screen: task-card, status: draft}
  # a choice is filled, shown and found in the list by its label (`enumDict` of the backend);
  # a decimal typed with the decimal comma, sent and shown with the point of English (the
  # language of the browser of the tests)
  - id: manager-sets-the-priority
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Ship the release, priority: High, hours: '2,5'}
      - submit: {}
      - expect: {screen: task-card, values: {priority: High, hours: '2.5'}}
      - open: task-list
      - open_item: {where: {title: Ship the release, priority: High}}
      - expect: {screen: task-card, status: draft}
  # "add here": a step added from the card of its task, the task fixed
  - id: manager-adds-a-step
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Plan the launch}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - action: add-step
      - fill: {title: Book the room}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      # a started task takes no more steps: the card no longer offers it (Step.validate_item
      # refuses them in the backend too)
      - transit: start
      - expect: {status: in_progress, action_absent: add-step}
  # a point (GeoJSON in the API) is edited and shown as its coordinates, latitude first
  - id: manager-places-a-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Inspect the site}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - fill: {location: '55.7558, 37.6173'}
      - submit: {}
      - expect: {values: {title: Inspect the site, location: '55.7558, 37.6173'}}
  # a to-many relationship: its picker sets the items to those of the list ([] for none),
  # the users of the team (sample/users/routes.py);
  # the list of the drafts (no search) is found by the label of a related item, read after
  # its rows
  - id: manager-adds-a-watcher
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Watch the release, assignee: Mary Manager, watchers: [Mary Manager, Victor Viewer]}
      - submit: {}
      - expect: {screen: task-card, status: draft, values: {watchers: Victor Viewer}}   # in the order of the backend
      - open: draft-tasks
      - open_item: {where: {title: Watch the release, assignee: Mary Manager}}
      - expect: {screen: task-card}
      - fill: {watchers: []}
      - submit: {}
      - expect: {values: {title: Watch the release, watchers: '—'}}
  # the home: tiles of the aggregates of the API, a task created from here and opened in the last ones
  - id: manager-starts-from-the-home
    role: manager
    steps:
      - open: home
      # the count of a tile, and the sum of the hours of another (the task of `e2e_data`)
      - expect: {tile: {review: 1, review-hours: 2.5}}
      - action: create
      - fill: {title: Plan from the home}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - open: home
      - open_item: {in: last-tasks, where: {title: Plan from the home}}
      - expect: {screen: task-card, status: draft}
  # a board: a task moved to the column of the status that a transit leads to, by its menu
  - id: manager-moves-a-task-on-the-board
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Move on the board}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - open: task-board
      - move: {where: {title: Move on the board}, to: in_progress}
      - open_item: {where: {title: Move on the board}}
      - expect: {screen: task-card, status: in_progress}
  # a bulk action: the selected rows started at once
  - id: manager-starts-tasks-at-once
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Start at once}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - open: task-list
      - select: {where: {title: Start at once}}
      - bulk: start-all
      - open_item: {where: {title: Start at once}}
      - expect: {screen: task-card, status: in_progress}
  # a calendar: the task of `manage.py e2e_data`, due now, on its day
  - id: viewer-reads-the-calendar
    role: viewer
    steps:
      - open: task-calendar
      - open_item: {where: {title: Review the plan}}
      - expect: {screen: task-card, status: draft}
  # the custom action `escalate` of the tasks: on the card, its priority asked for in its
  # dialog; then on the selected rows of the list, with its default (high)
  - id: manager-escalates-a-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Escalate the review}
      - submit: {}
      - expect: {screen: task-card, values: {priority: Normal}}
      - action: escalate
      - fill: {priority: Low}
      - submit: {}
      - expect: {values: {priority: Low}}
      - open: task-list
      - select: {where: {title: Escalate the review}}
      - bulk: escalate-all
      - open_item: {where: {title: Escalate the review}}
      - expect: {screen: task-card, values: {priority: High}}
  # the add of the calendar by a date-time: the day selected (today) at the time filled; a
  # task without a title is refused, its form kept open with the time
  - id: manager-plans-on-the-calendar
    role: manager
    steps:
      - open: task-calendar
      - action: add-task
      - fill: {title: '', due: 'today 10:30'}
      - submit: {}
      - expect: {error: title}
      - fill: {title: Plan on the calendar}
      - submit: {}
      - open_item: {where: {title: Plan on the calendar}}
      - expect: {screen: task-card, status: draft}
  # the form of an action that answers a file: the CSV of all the tasks saved, then its name
  - id: manager-exports-the-tasks
    role: manager
    steps:
      - open: export-tasks
      - submit: {}
      - expect: {state: done}
  # a guest, without a login: the public list of the tasks, and a task suggested with the
  # public custom action `suggest`
  - id: visitor-suggests-a-task
    role: visitor
    steps:
      - open: public-tasks
      - action: suggest
      - fill: {title: Suggested by a guest}
      - submit: {}
      - expect: {screen: public-tasks}
  # the same on the page of the form of the action: its result, with the answer of the action
  - id: visitor-suggests-a-task-on-its-page
    role: visitor
    steps:
      - open: suggest-task
      - fill: {title: Suggested on the page of a guest}
      - submit: {}
      - expect: {state: done}
  # two sessions (`as`): the manager has the list open while a guest suggests a task; the
  # title that the action gave the task, with its reference (`remember`: a value the server
  # made, not the text typed), finds that task in the list of the manager
  - id: manager-opens-a-suggested-task
    role: manager
    steps:
      - open: task-list
      - as: visitor
      - open: suggest-task
      - fill: {title: Suggested for the manager}
      - submit: {}
      - remember: {suggested: title}
      - as: manager
      - open_item: {where: {title: $suggested}}
      - expect: {screen: task-card, status: draft}
  # a payload with a relationship (`relation`): the transit `reopen` gives a finished task to the
  # user chosen with the picker of its dialog
  - id: manager-reopens-a-task-for-a-user
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Redo the report}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - transit: start
      - transit: {id: finish, payload: {report: Done}}
      - transit: {id: reopen, payload: {assignee: Victor Viewer}}
      - expect: {status: in_progress, values: {assignee: Victor Viewer}}
