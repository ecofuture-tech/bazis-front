# yaml-language-server: $schema=../../bazis/contrib/front/spec/schemas/product.schema.json
# The product spec of the sample: the tasks of a team with a workflow. The roles,
# statuses and transits that it references are created by the data migration
# tasks/migrations/0005_workflow.py.
spec: bazis-product/1
product:
  id: tasks
  name: Tasks
  summary: The tasks of a team, started and finished with a report
packages: [users, authing, permit, statusy, uploadable, ws, bg, async_background, async_request]
roles:
  - {id: manager, permit: manager, title: Manager, test_user: {username: manager}}
  - {id: viewer, permit: viewer, title: Viewer, test_user: {username: viewer}}
entities:
  - id: task
    resource: tasks.task
    title: Task
    fields:
      - {id: title, type: string}
      - {id: report, type: text}
      - {id: dt_created, type: datetime}
      - {id: assignee, relation: user}
      - {id: attachment, type: file}     # bazis-uploadable: a file uploaded with the task
    workflow:
      initial: draft
      statuses: [draft, in_progress, done]
      transitions:
        - {id: start, from: draft, to: in_progress}
        - {id: finish, from: in_progress, to: done, payload: {fields: [{id: report, type: text}]}}
    access:
      manager:
        view: all
        add: all
        change: {selector: all, statuses: [draft]}
        transit: [start, finish]
      viewer: {view: all}
  - id: user
    resource: users.user
    title: User
    fields:
      - {id: username, type: string}
scenarios:
  - id: manager-finishes-a-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Write the report}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - transit: start
      - transit: {id: finish, payload: {report: Done}}
      - expect: {status: done, field_readonly: title}
  - id: viewer-only-reads
    role: viewer
    steps:
      - open: task-list
      - expect: {action_absent: create}
      - open_item: {where: {title: Review the plan}}   # created by `manage.py e2e_data`
      # a field permission of the viewer (tasks/migrations/0005_workflow.py): the report is hidden
      - expect: {screen: task-card, action_absent: delete, field_absent: report}
  # the picker of the assignee searches the user by the label; the list shows the label
  - id: manager-assigns-a-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Assign the review, assignee: manager}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - open: task-list
      - open_item: {where: {title: Assign the review, assignee: manager}}
      - expect: {screen: task-card}
  # a field permission of the manager: the report is written by the transit `finish`, never
  # in the edit of the task
  - id: manager-cannot-change-the-report
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Draft the report}
      - submit: {}
      - expect: {screen: task-card, status: draft, field_readonly: report}
  # a submit followed by the `error` of a field fails: its form stays open
  - id: manager-cannot-save-an-empty-title
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: ''}
      - submit: {}
      - expect: {error: title}
      - fill: {title: Plan the week}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - fill: {title: ''}
      - submit: {}
      - expect: {error: title}
      - fill: {title: Plan the next week}
      - submit: {}
      - transit: start
      - expect: {status: in_progress, field_readonly: title}
  # the file is uploaded in the edit of the card (e2e/fixtures/ of the frontend), then shown
  # on the card
  - id: manager-attaches-a-brief
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Attach the brief}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - upload: {field: attachment, file: brief.txt}
      - submit: {}
      - expect: {values: {title: Attach the brief, attachment: brief.txt}}
  # bazis-ws: the assignee of a finished task is notified (sample/tasks/notify.py), over the
  # socket that the frontend opens after the login
  - id: manager-is-notified-of-a-finished-task
    role: manager
    steps:
      - open: task-list
      - action: create
      - fill: {title: Notify the assignee, assignee: manager}
      - submit: {}
      - expect: {screen: task-card, status: draft}
      - transit: start
      - transit: {id: finish, payload: {report: Done}}
      - expect: {status: done, notification: Notify the assignee}
