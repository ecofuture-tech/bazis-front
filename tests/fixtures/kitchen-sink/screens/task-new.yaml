# yaml-language-server: $schema=../../../../bazis/contrib/front/spec/schemas/screen.schema.json
# A create form as a page, extended, its picker of the assignee among the active users who are not
# staff (`filters`), then the card of the task.
spec: bazis-screen/1
id: task-new
title: {en: New task, ru: Новая задача}
description: {en: The task is created as a draft., ru: Задача создаётся черновиком.}
route: /tasks/new
entity: task
roles: [manager]
primitive: form
extend: true
form: {mode: create, fields: [title, assignee, priority], filters: {assignee: {is_active: true, is_staff: false}}, then: task-card}
states: [loading, error, forbidden, invalid]
