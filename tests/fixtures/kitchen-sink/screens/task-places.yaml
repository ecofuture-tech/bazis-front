# yaml-language-server: $schema=../../../../bazis/contrib/front/spec/schemas/screen.schema.json
# A list without an extension: its map of the items of its filter (the drafts due from today,
# a day of the browser), its create form (then the list of all the tasks), a custom action of
# the route set in its toolbar, its bulk action and its status filter; a grid of cards
# everywhere, each with the photos as its cover (the first image column), the priority above
# its title, the due day as its figure and its status in its muted line.
spec: bazis-screen/1
id: task-places
title: {en: Places, ru: Места}
route: /places
entity: task
roles: [manager, viewer]
primitive: list
list:
  columns: [photos, title, status, priority, due]
  layout: cards
  layout_phone: cards
  card: {eyebrow: priority, figure: due, meta: [status]}
  filters: [status]
  filter: {status: draft, due__gte: today}
  open: task-card
  map: {field: location}
  bulk:
    - {id: start-all, transit: start, label: {en: Start, ru: Начать}}
actions:
  - {id: create, primitive: form, mode: create, fields: [title], then: task-list, label: {en: New task, ru: Новая задача}}
  - id: count
    primitive: custom
    action: count
    fields: [priority]
    values: {priority: high}       # its dialog opens with a high priority
    label: {en: Count, ru: Посчитать}
    message: {en: The count is queued., ru: Подсчёт поставлен в очередь.}
states: [loading, empty, error, forbidden]
