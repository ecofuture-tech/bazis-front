# yaml-language-server: $schema=../../../../bazis/contrib/front/spec/schemas/screen.schema.json
# The list of the sample, generated: its map, its create form and its bulk action.
spec: bazis-screen/1
id: task-list
title: {en: Tasks, ru: Задачи}
description: {en: 'The tasks of the team, from the draft to the report.', ru: 'Задачи команды: от черновика до отчёта.'}
route: /tasks
entity: task
roles: [manager, viewer]
primitive: list
list:
  columns: [title, status, priority, assignee, dt_created]
  filters: [status, assignee, priority, dt_created]
  sort: [-dt_created]
  search: true
  open: task-card
  empty: {en: No tasks yet., ru: Задач пока нет.}
  map: {field: location}
  bulk:
    - {id: start-all, transit: start, label: {en: Start, ru: Начать}}   # the selected drafts started one by one
actions:
  - id: create
    primitive: form
    mode: create
    fields: [title, assignee, priority, watchers]
    then: task-card
    label: {en: New task, ru: Новая задача}
    description: {en: The task is created as a draft., ru: Задача создаётся черновиком.}
states: [loading, empty, error, forbidden]
