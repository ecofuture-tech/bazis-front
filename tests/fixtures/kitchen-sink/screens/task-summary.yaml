# yaml-language-server: $schema=../../../../bazis/contrib/front/spec/schemas/screen.schema.json
# A card without tabs, extended: its history and its related list under its heading, a create
# form in the header, an update form and a delete that says what it deletes; its title is not
# shown (the label of its item heads it), nor among the texts of the specs.
spec: bazis-screen/1
id: task-summary
title: {en: Summary, ru: Сводка}
route: /tasks/:id/summary
entity: task
roles: [manager, viewer]
primitive: card
extend: true
card:
  sections:
    - {id: main, fields: [title, status, assignee, dt_created]}
  transitions: true
  history: true
  related:
    - id: steps
      entity: step
      relation: task
      columns: [title, dt_created]
      add: {id: add-step, fields: [title], when: always}
actions:
  - id: delete
    primitive: destroy
    then: task-list
    description: {en: The task and its steps are deleted., ru: Задача удаляется вместе с шагами.}
  - {id: create, primitive: form, mode: create, fields: [title], then: task-summary}
  - id: edit
    primitive: form
    mode: update
    fields: [title, priority]
    description: {en: The title and the priority of the task., ru: Название и приоритет задачи.}
states: [loading, error, forbidden, not_found]
