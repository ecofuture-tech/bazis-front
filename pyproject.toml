[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# the files of the assets are package data (those tracked by Git); node_modules/ and dist/
# of the Node tooling are never packages, so that nothing of them reaches the wheel
packages.find = { include = ["bazis.*"], exclude = ["*.node_modules", "*.node_modules.*", "*.dist", "*.dist.*"] }
include-package-data = true

[tool.setuptools.exclude-package-data]
# the checks of the client (tests, fixtures, scripts, Node config) stay in the repository;
# every asset lists its own (scripts/check_wheel.py fails the build otherwise)
"bazis.contrib.front.assets.client" = ["package.json", "tsconfig.json"]
"bazis.contrib.front.assets.client.test" = ["*"]
"bazis.contrib.front.assets.client.test.fixtures" = ["*"]
"bazis.contrib.front.assets.client.scripts" = ["*"]

[tool.setuptools_scm]
version_file = "bazis/contrib/front/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[project]
name = "bazis-front"
description = "Frontend layer of Bazis: the contract, the specs and the TypeScript code copied into the frontend of a product."
keywords = ["bazis", "django", "fastapi", "pydantic", "framework", "jsonapi", "frontend", "typescript", "react"]
urls = { Home = "https://github.com/ecofuture-tech/bazis-front" }
authors = [{name = "Ilya Kharyn", email = "ilya.tt07@gmail.com"}]
maintainers = [{name = "Ilya Kharyn", email = "ilya.tt07@gmail.com"}]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: FastAPI",
]
dependencies = [
    "bazis>=2.5.0",
]

[project.optional-dependencies]
test = [
    "bazis-test-utils>=2.3.0",
    # the sample project has the capabilities of the contract: users, permit, statusy
    "bazis-users>=2.5.0",
    "bazis-permit>=2.4.1",
    "bazis-statusy>=2.4.1",
]
dev = [
    "ruff"
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "build", "dist", "docs", "__pycache__"]
extend-include = ["*.pyi"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # bugbear
    "UP",   # pyupgrade
    "C90",  # mccabe
]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "django",
    "fastapi",
    "starlette",
    "pydantic",
    "third-party",
    "bazis",
    "first-party",
    "local-folder"
]
sections = { "django" = ["django"], "fastapi" = ["fastapi"], "starlette" = ["starlette"], "pydantic" = ["pydantic"], "bazis" = ["bazis"] }
lines-after-imports = 2

[tool.pytest.ini_options]
django_settings_module = "sample.settings"